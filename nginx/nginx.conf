worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Не записываем query, заголовки, IP и тела запросов.
    log_format minimal '$request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout minimal;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $server_name zone=order_submissions:1m rate=30r/m;
    limit_req_zone $server_name zone=analytics_ingest:1m rate=20r/s;
    limit_req_zone $server_name zone=auth_requests:1m rate=10r/m;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        charset utf-8;
        client_max_body_size 32k;
        set $backend http://backend:8000;
        limit_req_status 429;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Cache-Control no-store always;

        location = /health {
            default_type application/json;
            alias /usr/share/nginx/html/health.json;
            access_log off;
        }

        location = /api {
            default_type application/json;
            return 404 '{"detail":"Маршрут не найден"}';
        }

        location = /api/applications {
            limit_req zone=order_submissions burst=10 nodelay;
            error_page 429 = @rate_limited;
            error_page 502 504 =503 @backend_unavailable;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
        }

        location = /admin {
            try_files /admin.html =404;
        }

        location = /api/auth/login {
            limit_req zone=auth_requests burst=10 nodelay;
            error_page 429 = @rate_limited;
            error_page 502 504 =503 @backend_unavailable;
            proxy_pass $backend;
            proxy_set_header Host $host;
        }

        location ^~ /api/analytics/ {
            limit_req zone=analytics_ingest burst=40 nodelay;
            error_page 429 = @rate_limited;
            error_page 502 504 =503 @backend_unavailable;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
        }

        location = /api/admin/docs {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location ^~ /api/ {
            error_page 502 504 =503 @backend_unavailable;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
        }

        location @backend_unavailable {
            default_type application/json;
            return 503 '{"error":"backend_not_available"}';
        }

        location @rate_limited {
            default_type application/json;
            return 429 '{"detail":"Слишком много запросов. Подождите минуту и повторите отправку."}';
        }

        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ =404;
        }
    }
}
