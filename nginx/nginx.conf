worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Не записываем query, заголовки, IP и тела запросов.
    log_format minimal '$request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout minimal;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        charset utf-8;
        client_max_body_size 1m;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control no-store always;

        location = /health {
            default_type application/json;
            alias /usr/share/nginx/html/health.json;
            access_log off;
        }

        location = /api {
            default_type application/json;
            return 503 '{"error":"backend_not_available"}';
        }

        location ^~ /api/ {
            default_type application/json;
            return 503 '{"error":"backend_not_available"}';
        }

        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ =404;
        }
    }
}
