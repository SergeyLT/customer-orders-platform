name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-orders-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Проверить Compose
        run: python scripts/check_compose.py
      - name: Проверить управление деплоем
        run: python -m unittest discover -s tests -v
      - name: Проверить Registry с переменными ресурса
        run: python scripts/smoke_registry.py
      - name: Проверить frontend
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Собрать тестовый backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: test
          load: true
          tags: customer-orders-backend:test
      - name: Проверить API и миграции с PostgreSQL
        run: python scripts/test_backend.py
      - name: Собрать web
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: customer-orders-web:check
          build-args: |
            APP_VERSION=${{ github.sha }}
            RELEASE_ID=${{ github.run_id }}-${{ github.run_attempt }}
      - name: Собрать backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          load: true
          tags: customer-orders-backend:check
          build-args: |
            APP_VERSION=${{ github.sha }}
            RELEASE_ID=${{ github.run_id }}-${{ github.run_attempt }}
      - name: Проверить сохранённый API-контракт
        run: python scripts/export_openapi.py --check
      - name: Проверить полный стек через Nginx
        env:
          EXPECTED_VERSION: ${{ github.sha }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python scripts/smoke_stack.py --version "$EXPECTED_VERSION" --release "$RELEASE_ID"
      - name: Сохранить проверенные образы
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_ENABLED == 'true'
        env:
          VERSION: ${{ github.sha }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker save customer-orders-web:check --output web-image.tar
          docker save customer-orders-backend:check --output backend-image.tar
          python -c 'import json,os; from pathlib import Path; Path("release.json").write_text(json.dumps({"version":os.environ["VERSION"],"release":os.environ["RELEASE_ID"]}), encoding="utf-8")'
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_ENABLED == 'true'
        with:
          name: verified-images
          path: |
            web-image.tar
            backend-image.tar
            release.json
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_ENABLED == 'true'
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.reference.outputs.image }}
      backend_image: ${{ steps.reference.outputs.backend_image }}
      version: ${{ steps.reference.outputs.version }}
      release: ${{ steps.reference.outputs.release }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-images
      - name: Проверить адрес Registry
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
        run: |
          python -c 'import os,re; value=os.environ["REGISTRY_HOST"]; assert re.fullmatch(r"[a-z0-9][a-z0-9.-]*\.[a-z]{2,}", value), "REGISTRY_HOST должен быть доменом без схемы и пути"'
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Опубликовать проверенные образы
        id: reference
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          docker load --input web-image.tar
          docker load --input backend-image.tar
          VERSION=$(python -c 'import json,os; data=json.load(open("release.json")); assert data["version"] == os.environ["EXPECTED_VERSION"]; print(data["version"])')
          RELEASE_ID=$(python -c 'import json; print(json.load(open("release.json"))["release"])')
          for COMPONENT in web backend; do
            TARGET="$REGISTRY_HOST/customer-orders-platform/$COMPONENT:$TAG"
            docker tag "customer-orders-$COMPONENT:check" "$TARGET"
            docker push "$TARGET"
            REFERENCE=$(docker image inspect "$TARGET" --format '{{index .RepoDigests 0}}')
            if [ "$COMPONENT" = web ]; then
              echo "image=$REFERENCE" >> "$GITHUB_OUTPUT"
            else
              echo "backend_image=$REFERENCE" >> "$GITHUB_OUTPUT"
            fi
            printf '### %s\n\nImage: %s\n\n' "$COMPONENT" "$REFERENCE" >> "$GITHUB_STEP_SUMMARY"
          done
          printf 'version=%s\nrelease=%s\n' "$VERSION" "$RELEASE_ID" >> "$GITHUB_OUTPUT"
          printf 'Version: %s\n\nRelease: %s\n' "$VERSION" "$RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # Однократная защита перехода: сначала подготовьте роль БД и новые переменные Coolify.
    if: vars.DEPLOY_ENABLED == 'true' && vars.BACKEND_DEPLOY_READY == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Развернуть и подтвердить сборку
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          WEB_IMAGE: ${{ needs.publish.outputs.image }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend_image }}
          EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_ID: ${{ needs.publish.outputs.release }}
        run: python scripts/deploy.py --image "$WEB_IMAGE" --backend-image "$BACKEND_IMAGE" --version "$EXPECTED_VERSION" --release "$RELEASE_ID"
